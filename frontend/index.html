<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIFF Draw Send</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --bg: #f4efe4;
        --panel: rgba(255, 251, 244, 0.9);
        --ink: #18222f;
        --accent: #ed6a3a;
        --accent-strong: #cf4b1f;
        --accent-soft: #ffcf99;
        --line: rgba(24, 34, 47, 0.12);
        --success: #1c7c54;
        --error: #b42318;
        --tool-height: 44px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Zen Kaku Gothic New", sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        background:
          radial-gradient(circle at top left, rgba(255, 207, 153, 0.8), transparent 34%),
          radial-gradient(circle at bottom right, rgba(237, 106, 58, 0.18), transparent 28%),
          linear-gradient(135deg, #f9f4ea 0%, #efe5d2 100%);
      }

      .shell {
        width: min(880px, calc(100% - 24px));
        margin: 0 auto;
        padding: 16px 0 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      body.debug-mode .grid {
        grid-template-columns: 340px minmax(0, 1fr);
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 16px 32px rgba(90, 63, 34, 0.08);
      }

      .config {
        padding: 22px;
      }

      .config[hidden] {
        display: none;
      }

      .config h2 {
        margin: 0 0 16px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.1rem;
        letter-spacing: -0.03em;
      }

      .field {
        margin-bottom: 14px;
      }

      .field.is-disabled {
        opacity: 0.38;
      }

      .field label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid rgba(24, 34, 47, 0.14);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.85);
        font: inherit;
        color: inherit;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      .quick-tools {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
        justify-content: end;
        margin-bottom: 10px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        font: 700 0.96rem/1 "Space Grotesk", sans-serif;
        cursor: pointer;
        transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      button[aria-busy="true"] {
        cursor: wait;
      }

      .primary {
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow: 0 10px 24px rgba(207, 75, 31, 0.28);
      }

      .secondary {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(24, 34, 47, 0.08);
      }

      .ghost {
        color: var(--ink);
        background: rgba(255, 207, 153, 0.35);
      }

      .status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 16px;
        line-height: 1.5;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(24, 34, 47, 0.08);
      }

      .status[data-tone="success"] {
        color: var(--success);
      }

      .status[data-tone="error"] {
        color: var(--error);
      }

      .status[hidden] {
        display: none;
      }

      .hint {
        margin-top: 12px;
        font-size: 0.88rem;
        line-height: 1.6;
        color: rgba(24, 34, 47, 0.72);
      }

      .board {
        padding: 16px;
      }

      .canvas-frame {
        position: relative;
        padding: 12px;
        border-radius: 26px;
        -webkit-user-select: none;
        user-select: none;
        background:
          linear-gradient(180deg, rgba(24, 34, 47, 0.05), rgba(24, 34, 47, 0.02)),
          white;
        border: 1px solid rgba(24, 34, 47, 0.08);
      }

      canvas {
        display: block;
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        background:
          linear-gradient(45deg, rgba(24, 34, 47, 0.04) 25%, transparent 25%, transparent 75%, rgba(24, 34, 47, 0.04) 75%, rgba(24, 34, 47, 0.04)),
          linear-gradient(45deg, rgba(24, 34, 47, 0.04) 25%, transparent 25%, transparent 75%, rgba(24, 34, 47, 0.04) 75%, rgba(24, 34, 47, 0.04));
        background-position: 0 0, 14px 14px;
        background-size: 28px 28px;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        box-shadow: inset 0 0 0 1px rgba(24, 34, 47, 0.08);
      }

      canvas.is-filled {
        background: var(--canvas-fill, white);
      }

      .board-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .board-actions button {
        flex: 1 1 120px;
      }

      .board-actions .primary {
        flex: 2 1 240px;
      }

      .board-status {
        margin-top: 14px;
      }

      .debug-link {
        display: none;
        margin-top: 12px;
        font-size: 0.82rem;
        color: rgba(24, 34, 47, 0.56);
      }

      .toggle-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: var(--tool-height);
        padding: 0 12px;
        border: 1px solid rgba(24, 34, 47, 0.14);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85);
        color: rgba(24, 34, 47, 0.72);
        font: 700 0.92rem/1 "Space Grotesk", sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease,
          border-color 140ms ease;
      }

      .toggle-button.is-active {
        background: linear-gradient(135deg, rgba(255, 207, 153, 0.65), rgba(237, 106, 58, 0.18));
        color: var(--ink);
        border-color: rgba(237, 106, 58, 0.32);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
      }

      .toggle-button input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-button span:last-child {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        line-height: 1;
      }

      .compact-status {
        margin-top: 12px;
      }

      .color-swatch {
        position: relative;
        display: block;
        width: 100%;
        height: var(--tool-height);
        border: 1px solid rgba(24, 34, 47, 0.14);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85);
        overflow: hidden;
      }

      .quick-tools .field select {
        height: var(--tool-height);
        padding: 0 6px;
      }

      .color-swatch input[type="color"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }

      .color-swatch input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .color-swatch input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 0;
      }

      .color-swatch input[type="color"]::-moz-color-swatch {
        border: 0;
        border-radius: 0;
      }

      body.debug-mode .debug-link {
        display: block;
      }

      @media (max-width: 900px) {
        body.debug-mode .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .board-actions .primary {
          flex-basis: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="grid">
        <aside id="configPanel" class="panel config">
          <h2>Config</h2>

          <div class="field">
            <label for="liffId">LIFF ID</label>
            <input id="liffId" type="text" placeholder="例: 2000000000-xxxxxxxx" />
          </div>

          <div class="field">
            <label for="apiBaseUrl">Render API Base URL</label>
            <input id="apiBaseUrl" type="url" placeholder="https://your-app.onrender.com" />
          </div>

          <div class="actions">
            <button id="saveConfigButton" class="secondary" type="button">Save Config</button>
            <button id="initLiffButton" class="ghost" type="button">Initialize LIFF</button>
          </div>

          <p class="hint">
            GitHub Pages 側ではこの入力値を localStorage に保持します。Share
            Target Picker は LINE アプリ内ブラウザで開いたときのみ利用できます。通常画面では
            `?debug=1` を付けたときだけこの設定欄を表示します。
          </p>
        </aside>

        <section class="panel board">
          <div class="quick-tools">
            <div class="field">
              <label for="brushColor">ペンの色</label>
              <label class="color-swatch" for="brushColor">
                <input id="brushColor" type="color" value="#18222f" />
              </label>
            </div>

            <div class="field">
              <label for="brushSize">太さ</label>
              <select id="brushSize">
                <option value="4">4 px</option>
                <option value="8" selected>8 px</option>
                <option value="12">12 px</option>
                <option value="18">18 px</option>
              </select>
            </div>

            <div class="field">
              <label for="transparentToggle">背景を透明</label>
              <label id="transparentToggleButton" class="toggle-button" for="transparentToggle">
                <input id="transparentToggle" type="checkbox" checked />
                <span id="transparentToggleText">オン</span>
              </label>
            </div>

            <div class="field">
              <label for="backgroundColor">背景色</label>
              <label class="color-swatch" for="backgroundColor">
                <input id="backgroundColor" type="color" value="#ffffff" />
              </label>
            </div>

            <div class="field">
              <label for="outlineToggle">縁取り</label>
              <label id="outlineToggleButton" class="toggle-button" for="outlineToggle">
                <input id="outlineToggle" type="checkbox" />
                <span id="outlineToggleText">オフ</span>
              </label>
            </div>

            <div class="field">
              <label for="outlineColor">縁の色</label>
              <label class="color-swatch" for="outlineColor">
                <input id="outlineColor" type="color" value="#ffffff" />
              </label>
            </div>

            <div class="field">
              <label for="outlineSize">縁の太さ</label>
              <select id="outlineSize">
                <option value="2">2 px</option>
                <option value="4" selected>4 px</option>
                <option value="6">6 px</option>
                <option value="8">8 px</option>
              </select>
            </div>
          </div>

          <div class="canvas-frame">
            <canvas id="drawCanvas" width="1024" height="1024"></canvas>
          </div>

          <div class="board-actions">
            <button id="shareButton" class="primary" type="button">トークに送る</button>
            <button id="undoButton" class="secondary" type="button" disabled>元に戻す</button>
            <button id="clearButton" class="secondary" type="button">全部消す</button>
          </div>

          <div id="status" class="status compact-status" data-tone="default" role="status" aria-live="polite">
            準備しています...
          </div>

          <div id="debugInfo" class="status compact-status" data-tone="default" hidden></div>
          <p class="debug-link">Debug mode: URL の末尾に `?debug=1` を付けると設定欄を表示します。</p>
        </section>
      </section>
    </main>

    <script>
      const defaultConfig = {
        liffId: "2009927876-M1sXwp0q",
        apiBaseUrl: "https://liff-image.onrender.com",
      };

      const storageKeys = {
        liffId: "liff-draw-send:liff-id",
        apiBaseUrl: "liff-draw-send:api-base-url",
        brushColor: "liff-draw-send:brush-color",
        brushSize: "liff-draw-send:brush-size",
        transparentBackground: "liff-draw-send:transparent-background",
        backgroundColor: "liff-draw-send:background-color",
        outlineEnabled: "liff-draw-send:outline-enabled",
        outlineColor: "liff-draw-send:outline-color",
        outlineSize: "liff-draw-send:outline-size",
      };

      const searchParams = new URLSearchParams(window.location.search);
      const isDebugMode = searchParams.get("debug") === "1";
      const isMockMode = searchParams.get("mock") === "1";

      // 1 枚あたり 1024x1024 の canvas を保持するため、端末メモリを考えて上限を小さめにする
      const maxHistory = 10;

      const state = {
        liffInitialized: false,
        drawing: false,
        pointerId: null,
        strokePoints: [],
        strokeBase: null,
        isBlank: true,
        history: [],
      };

      const statusElement = document.getElementById("status");
      const debugInfoElement = document.getElementById("debugInfo");
      const liffIdInput = document.getElementById("liffId");
      const apiBaseUrlInput = document.getElementById("apiBaseUrl");
      const brushColorInput = document.getElementById("brushColor");
      const brushSizeInput = document.getElementById("brushSize");
      const transparentToggleInput = document.getElementById("transparentToggle");
      const transparentToggleButton = document.getElementById("transparentToggleButton");
      const transparentToggleText = document.getElementById("transparentToggleText");
      const backgroundColorInput = document.getElementById("backgroundColor");
      const outlineToggleInput = document.getElementById("outlineToggle");
      const outlineToggleButton = document.getElementById("outlineToggleButton");
      const outlineToggleText = document.getElementById("outlineToggleText");
      const outlineColorInput = document.getElementById("outlineColor");
      const outlineSizeInput = document.getElementById("outlineSize");
      const initLiffButton = document.getElementById("initLiffButton");
      const saveConfigButton = document.getElementById("saveConfigButton");
      const shareButton = document.getElementById("shareButton");
      const clearButton = document.getElementById("clearButton");
      const undoButton = document.getElementById("undoButton");
      const configPanel = document.getElementById("configPanel");
      const canvas = document.getElementById("drawCanvas");
      const context = canvas.getContext("2d");
      const backgroundColorField = backgroundColorInput.closest(".field");
      const outlineColorField = outlineColorInput.closest(".field");
      const outlineSizeField = outlineSizeInput.closest(".field");

      function setStatus(message, tone = "default") {
        statusElement.textContent = message;
        statusElement.dataset.tone = tone;
      }

      function setDebugInfo(message, tone = "default") {
        if (!message) {
          debugInfoElement.hidden = true;
          debugInfoElement.textContent = "";
          debugInfoElement.dataset.tone = "default";
          return;
        }

        if (!isDebugMode) {
          debugInfoElement.hidden = true;
          debugInfoElement.textContent = "";
          debugInfoElement.dataset.tone = "default";
          return;
        }

        debugInfoElement.hidden = false;
        debugInfoElement.textContent = message;
        debugInfoElement.dataset.tone = tone;
      }

      function showError(message, debugDetail) {
        setStatus(message, "error");
        setDebugInfo(debugDetail, "error");
      }

      function describeError(error) {
        return (
          (error && error.code ? error.code + " / " : "") +
          (error && error.message ? error.message : String(error))
        );
      }

      function saveConfig() {
        localStorage.setItem(storageKeys.liffId, liffIdInput.value.trim());
        localStorage.setItem(storageKeys.apiBaseUrl, apiBaseUrlInput.value.trim());
        setStatus("設定を保存しました。", "success");
      }

      function saveDrawPreferences() {
        localStorage.setItem(storageKeys.brushColor, brushColorInput.value);
        localStorage.setItem(storageKeys.brushSize, brushSizeInput.value);
        localStorage.setItem(storageKeys.transparentBackground, String(transparentToggleInput.checked));
        localStorage.setItem(storageKeys.backgroundColor, backgroundColorInput.value);
        localStorage.setItem(storageKeys.outlineEnabled, String(outlineToggleInput.checked));
        localStorage.setItem(storageKeys.outlineColor, outlineColorInput.value);
        localStorage.setItem(storageKeys.outlineSize, outlineSizeInput.value);
      }

      function loadConfig() {
        liffIdInput.value = localStorage.getItem(storageKeys.liffId) || defaultConfig.liffId;
        apiBaseUrlInput.value = localStorage.getItem(storageKeys.apiBaseUrl) || defaultConfig.apiBaseUrl;
        brushColorInput.value = localStorage.getItem(storageKeys.brushColor) || "#18222f";
        brushSizeInput.value = localStorage.getItem(storageKeys.brushSize) || "8";
        transparentToggleInput.checked =
          (localStorage.getItem(storageKeys.transparentBackground) || "true") === "true";
        backgroundColorInput.value = localStorage.getItem(storageKeys.backgroundColor) || "#ffffff";
        outlineToggleInput.checked = localStorage.getItem(storageKeys.outlineEnabled) === "true";
        outlineColorInput.value = localStorage.getItem(storageKeys.outlineColor) || "#ffffff";
        outlineSizeInput.value = localStorage.getItem(storageKeys.outlineSize) || "4";
      }

      function updateOutlineControls() {
        const enabled = outlineToggleInput.checked;
        outlineColorInput.disabled = !enabled;
        outlineSizeInput.disabled = !enabled;
        outlineColorField.classList.toggle("is-disabled", !enabled);
        outlineSizeField.classList.toggle("is-disabled", !enabled);
        outlineToggleButton.classList.toggle("is-active", enabled);
        outlineToggleText.textContent = enabled ? "オン" : "オフ";
        saveDrawPreferences();
      }

      function updateCanvasPreviewBackground() {
        const transparent = transparentToggleInput.checked;

        canvas.classList.toggle("is-filled", !transparent);
        canvas.style.setProperty("--canvas-fill", backgroundColorInput.value);
        backgroundColorInput.disabled = transparent;
        backgroundColorField.classList.toggle("is-disabled", transparent);
        transparentToggleButton.classList.toggle("is-active", transparent);
        transparentToggleText.textContent = transparent ? "オン" : "オフ";
        saveDrawPreferences();
      }

      function snapshotCanvas() {
        const snapshot = document.createElement("canvas");
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        snapshot.getContext("2d").drawImage(canvas, 0, 0);
        return snapshot;
      }

      function pushHistory(image) {
        state.history.push({ image, isBlank: state.isBlank });
        if (state.history.length > maxHistory) {
          state.history.shift();
        }
        undoButton.disabled = false;
      }

      function undo() {
        const entry = state.history.pop();
        if (!entry) {
          return;
        }

        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(entry.image, 0, 0);
        state.isBlank = entry.isBlank;
        undoButton.disabled = state.history.length === 0;
      }

      function clearCanvas() {
        if (state.isBlank) {
          return;
        }

        pushHistory(snapshotCanvas());
        context.clearRect(0, 0, canvas.width, canvas.height);
        state.isBlank = true;
        setStatus("全部消しました。「元に戻す」で戻せます。");
      }

      function getPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        return {
          x: (event.clientX - rect.left) * scaleX,
          y: (event.clientY - rect.top) * scaleY,
        };
      }

      function traceStroke(points) {
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        if (points.length === 1) {
          context.lineTo(points[0].x, points[0].y);
        }
        for (let index = 1; index < points.length; index += 1) {
          context.lineTo(points[index].x, points[index].y);
        }
      }

      // 縁取りが同じストローク内の線を上書きしないよう、毎回ストローク全体を描き直す
      function renderCurrentStroke() {
        const brushSize = Number(brushSizeInput.value);

        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(state.strokeBase, 0, 0);
        traceStroke(state.strokePoints);

        if (outlineToggleInput.checked) {
          context.strokeStyle = outlineColorInput.value;
          context.lineWidth = brushSize + Number(outlineSizeInput.value) * 2;
          context.stroke();
        }

        context.strokeStyle = brushColorInput.value;
        context.lineWidth = brushSize;
        context.stroke();
      }

      function handlePointerDown(event) {
        event.preventDefault();

        // 2 本目の指で別のストロークが始まって線が乱れないよう、描画中は他のポインターを無視する
        if (state.drawing || !event.isPrimary) {
          return;
        }

        canvas.setPointerCapture(event.pointerId);

        const base = snapshotCanvas();
        pushHistory(base);

        state.drawing = true;
        state.pointerId = event.pointerId;
        state.strokeBase = base;
        state.strokePoints = [getPoint(event)];
        state.isBlank = false;
        renderCurrentStroke();
      }

      function handlePointerMove(event) {
        event.preventDefault();

        if (!state.drawing || event.pointerId !== state.pointerId) {
          return;
        }

        state.strokePoints.push(getPoint(event));
        renderCurrentStroke();
      }

      function handlePointerUp(event) {
        if (event.pointerId !== state.pointerId) {
          return;
        }

        state.drawing = false;
        state.pointerId = null;
        state.strokePoints = [];
        state.strokeBase = null;
      }

      function buildExportDataUrl() {
        if (!transparentToggleInput.checked) {
          const exportCanvas = document.createElement("canvas");
          exportCanvas.width = canvas.width;
          exportCanvas.height = canvas.height;
          const exportContext = exportCanvas.getContext("2d");
          exportContext.fillStyle = backgroundColorInput.value;
          exportContext.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
          exportContext.drawImage(canvas, 0, 0);
          return exportCanvas.toDataURL("image/png");
        }

        return canvas.toDataURL("image/png");
      }

      async function initLiff() {
        const liffId = liffIdInput.value.trim();

        if (isMockMode) {
          state.liffInitialized = true;
          setStatus("Mock mode: LINE 認証なしで UI を確認できます。", "success");
          return;
        }

        if (!liffId) {
          showError("画面の準備に失敗しました。LINE アプリから開き直してください。", "LIFF ID が未設定です。");
          return;
        }

        if (typeof liff === "undefined") {
          showError(
            "読み込みに失敗しました。通信環境を確認して開き直してください。",
            "LIFF SDK の読み込みに失敗しました。",
          );
          return;
        }

        try {
          setStatus("準備しています...");
          await liff.init({ liffId });

          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          if (!liff.isApiAvailable("shareTargetPicker")) {
            showError(
              "この画面からは送信できません。LINE アプリで開いてください。",
              "shareTargetPicker が利用できない環境です。",
            );
            return;
          }

          state.liffInitialized = true;
          setStatus("描けたら「トークに送る」で送信できます。", "success");
          setDebugInfo("");
        } catch (error) {
          console.error(error);
          showError(
            "画面の準備に失敗しました。LINE アプリから開き直してください。",
            "LIFF 初期化に失敗しました: " + describeError(error),
          );
        }
      }

      async function uploadImage(dataUrl) {
        const apiBaseUrl = apiBaseUrlInput.value.trim().replace(/\/$/, "");

        if (!apiBaseUrl) {
          throw new Error("Render API Base URL を入力してください。");
        }

        const response = await fetch(apiBaseUrl + "/api/upload", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ imageData: dataUrl }),
        });

        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || "画像アップロードに失敗しました。");
        }

        return response.json();
      }

      async function shareImage() {
        if (state.isBlank) {
          setStatus("先に絵を描いてください。", "error");
          return;
        }

        if (isMockMode) {
          setStatus("Mock mode では送信しません。UI 確認専用です。", "default");
          return;
        }

        // 失敗理由は initLiff 側で表示済み
        if (!state.liffInitialized) {
          await initLiff();

          if (!state.liffInitialized) {
            return;
          }
        }

        shareButton.disabled = true;
        shareButton.setAttribute("aria-busy", "true");
        shareButton.textContent = "送信中...";
        setDebugInfo("");

        try {
          setStatus("画像を準備しています...");
          const exportDataUrl = buildExportDataUrl();
          const { imageUrl } = await uploadImage(exportDataUrl);
          setDebugInfo("アップロード済み画像 URL: " + imageUrl, "success");

          setStatus("送信先を選択しています...");
          const result = await liff.shareTargetPicker([
            {
              type: "image",
              originalContentUrl: imageUrl,
              previewImageUrl: imageUrl,
            },
          ]);

          if (result === null) {
            setStatus("送信はキャンセルされました。", "default");
            setDebugInfo("送信はキャンセルされました。画像 URL: " + imageUrl, "default");
          } else {
            setStatus("画像を送信しました。", "success");
            setDebugInfo(
              "shareTargetPicker は解決されました。画像 URL: " +
                imageUrl +
                (result && result.status ? " / status: " + result.status : ""),
              "success",
            );
          }
        } catch (error) {
          console.error(error);
          setStatus("共有処理に失敗しました。時間をおいてもう一度お試しください。", "error");
          setDebugInfo("詳細: " + describeError(error), "error");
        } finally {
          shareButton.disabled = false;
          shareButton.removeAttribute("aria-busy");
          shareButton.textContent = "トークに送る";
        }
      }

      loadConfig();
      document.body.classList.toggle("debug-mode", isDebugMode);
      configPanel.hidden = !isDebugMode;
      debugInfoElement.hidden = !isDebugMode;
      context.lineCap = "round";
      context.lineJoin = "round";
      updateCanvasPreviewBackground();
      updateOutlineControls();

      brushColorInput.addEventListener("change", saveDrawPreferences);
      brushSizeInput.addEventListener("change", saveDrawPreferences);
      transparentToggleInput.addEventListener("change", updateCanvasPreviewBackground);
      backgroundColorInput.addEventListener("change", updateCanvasPreviewBackground);
      outlineToggleInput.addEventListener("change", updateOutlineControls);
      outlineColorInput.addEventListener("change", saveDrawPreferences);
      outlineSizeInput.addEventListener("change", saveDrawPreferences);
      saveConfigButton.addEventListener("click", saveConfig);
      initLiffButton.addEventListener("click", () => initLiff());
      shareButton.addEventListener("click", shareImage);
      undoButton.addEventListener("click", undo);
      clearButton.addEventListener("click", clearCanvas);

      canvas.addEventListener("pointerdown", handlePointerDown);
      canvas.addEventListener("pointermove", handlePointerMove);
      canvas.addEventListener("pointerup", handlePointerUp);
      canvas.addEventListener("pointerleave", handlePointerUp);
      canvas.addEventListener("pointercancel", handlePointerUp);
      canvas.addEventListener("dragstart", (event) => event.preventDefault());
      canvas.addEventListener("selectstart", (event) => event.preventDefault());

      initLiff();
    </script>
  </body>
</html>
