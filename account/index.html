<!DOCTYPE html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="../shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../shared/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f4f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex" />
    <title>プラン｜おくるん</title>
    <meta name="description" content="おくるんのプラン（無料・有償）と、使える機能です。" />
    <link rel="stylesheet" href="../shared/ui.css?v=202610242348" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../config.js?v=202610242348"></script>
    <script src="../shared/log.js?v=202610242348"></script>
    <script src="../shared/credit.js?v=202610242348"></script>
    <script src="../shared/plan.js?v=202610242348"></script>
    <script src="../shared/liff.js?v=202610242348"></script>
    <script src="./app.js?v=202610242348" defer></script>
    <style>
      .plan-now {
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 20px 12px;
        text-align: center;
      }

      .plan-name {
        font-size: 24px;
        font-weight: 900;
      }

      :root[data-plan="premium"] .plan-name {
        color: var(--ls-accent);
      }

      .plan-sub {
        color: var(--ls-subtext);
        font-size: 13px;
      }

      /* 機能ごとに、無料・有償で使えるか */
      .plan-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .plan-table th,
      .plan-table td {
        padding: 10px 6px;
        border-bottom: 1px solid var(--ls-line);
        text-align: center;
      }

      .plan-table th:first-child,
      .plan-table td:first-child {
        text-align: left;
      }

      .plan-table thead th {
        color: var(--ls-subtext);
        font-size: 12px;
        white-space: nowrap;
      }

      .plan-table .is-current {
        background: var(--ls-accent-soft);
      }

      .plan-actions {
        display: grid;
        gap: 8px;
      }

      .plan-actions .ls-button {
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="ls-page">
      <header class="ls-topbar">
        <a class="ls-back" href="../">おくるん</a>
        <h1 class="ls-title">プラン</h1>
        <span class="ls-topbar-end"></span>
      </header>

      <div class="ls-stack">
        <section class="ls-panel plan-now" aria-live="polite">
          <span class="plan-sub">あなたのプラン</span>
          <span id="planName" class="plan-name">確かめています…</span>
          <span id="planSub" class="plan-sub"></span>
        </section>

        <section class="ls-panel">
          <h2 class="ls-panel-title">使える機能</h2>
          <table class="plan-table">
            <thead>
              <tr><th scope="col">機能</th><th scope="col" data-col="free">無料</th><th scope="col" data-col="premium">有償</th></tr>
            </thead>
            <tbody id="featureRows"></tbody>
          </table>
          <p class="ls-hint">カード・場所や予定・文字や手書き・返事は、どのプランでも使えます。</p>
        </section>

        <section class="ls-panel plan-actions">
          <a id="upgradeButton" class="ls-button is-primary" href="#" hidden>⭐ 有償プランにする</a>
          <a id="portalButton" class="ls-button" href="#" target="_blank" rel="noopener" hidden>お支払いの確認・解約</a>
          <p id="planNote" class="ls-hint"></p>
        </section>
      </div>
    </main>
    <!-- 電波がなくても開けるように（sw.js） -->
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
  </body>
</html>
