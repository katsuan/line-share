<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="../shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../shared/apple-touch-icon.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#f5f4f9" />
    <title>文字・手書き｜おくるん</title>
    <meta name="description" content="文字入りアイコンや手書きの絵を作って、LINEのトークに送れます。" />
    <!-- 手書き風の書体（Yomogi・Klee One、SIL OFL） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Yomogi&display=swap" />
    <link rel="stylesheet" href="../shared/ui.css?v=202610132020" />
    <link rel="stylesheet" href="./style.css?v=202610132020" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="../config.js?v=202610132020"></script>
    <script src="../shared/credit.js?v=202610132020"></script>
    <script src="../shared/liff.js?v=202610132020"></script>
    <script src="../shared/ui.js?v=202610132020" defer></script>
    <script type="module" src="./app.js?v=202610132020"></script>
  </head>
  <body class="ls-has-sendbar">
    <main class="ls-page">
      <header class="ls-topbar">
        <a class="ls-back" href="../">おくるん</a>
        <h1 class="ls-title">文字・手書き</h1>
        <span class="ls-topbar-end"></span>
      </header>

      <div class="ls-tabs" role="tablist" aria-label="作り方">
        <button id="modeText" class="ls-tab" type="button" role="tab" aria-controls="textPanel">🔤 文字</button>
        <button id="modeDraw" class="ls-tab" type="button" role="tab" aria-controls="drawPanel">👆 手書き</button>
      </div>

      <div class="ls-stack">
        <section id="previewStage" class="ls-preview image-stage" data-send-mode="image">
          <span class="ls-preview-label">送信プレビュー</span>
          <div id="cardFrame" class="card-frame">
            <div id="canvasFrame" class="canvas-frame">
              <canvas id="canvas" aria-label="プレビュー"></canvas>
              <p id="drawHint" class="draw-hint" hidden>ここを指でなぞって描けます</p>
            </div>
            <p class="ls-credit card-only">Created by おくるん ›</p>
          </div>
          <div class="send-mode-row">
            <span class="send-mode-label">送り方</span>
            <div class="ls-chips send-mode-chips" role="radiogroup" aria-label="送り方">
              <button id="sendModeImage" class="ls-chip is-small" type="button" role="radio">🖼️ 画像（透過OK）</button>
              <button id="sendModeCard" class="ls-chip is-small" type="button" role="radio">🪧 カード（動きOK）</button>
            </div>
          </div>
        </section>

        <div class="ls-folds">
          <details id="textPanel" class="ls-fold" role="tabpanel" aria-labelledby="modeText" open>
            <summary><span class="ls-fold-icon" aria-hidden="true">🔤</span>文字 <span id="textMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <textarea id="textInput" class="ls-input text-input" rows="2" maxlength="40" aria-label="文字" placeholder="例：OK / ありがとう"></textarea>
              <div id="textPresets" class="ls-chips" aria-label="よく使う文字"></div>
              <button id="clearTextButton" class="ls-button is-danger" type="button">文字を消す</button>
              <div class="ls-field">
                <span class="ls-label">文字の色</span>
                <div id="textColors" class="ls-swatches"></div>
              </div>
              <div class="ls-field">
                <span class="ls-label">書体</span>
                <div id="fontList" class="ls-chips"></div>
              </div>
              <p class="ls-hint">手書きタブに切り替えると、文字の上から描き足せます。文字を消すと手書きだけになります。</p>
            </div>
          </details>

          <details id="drawPanel" class="ls-fold" role="tabpanel" aria-labelledby="modeDraw" open hidden>
            <summary><span class="ls-fold-icon" aria-hidden="true">✏️</span>ペン <span id="penMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <div class="ls-field">
                <span class="ls-label">ペンの色</span>
                <div id="penColors" class="ls-swatches"></div>
              </div>
              <div class="ls-field">
                <span class="ls-label">ペンの太さ</span>
                <div id="penSizes" class="ls-chips"></div>
                <!-- 3段階のほかに、細かく選べるスライダー。右の丸が実際に描ける線の太さ -->
                <div class="pen-size-row">
                  <input id="penSizeRange" class="pen-size-range" type="range" min="2" max="40" step="1" aria-label="ペンの太さを細かく選ぶ" />
                  <span class="pen-size-dot-box" aria-hidden="true"><span id="penSizeDot" class="pen-size-dot"></span></span>
                </div>
              </div>
              <div class="ls-actions">
                <button id="undoButton" class="ls-button" type="button" disabled>↶ 元に戻す</button>
                <button id="clearButton" class="ls-button is-danger" type="button" disabled>手書きを全部消す</button>
              </div>
              <!-- 文字が入っているときだけ。消すと白紙に手書きだけで描ける -->
              <div id="drawTextRow" class="draw-text-row" hidden>
                <p class="ls-hint">文字「<span id="drawTextLabel"></span>」の上に描いています。</p>
                <button id="drawClearTextButton" class="ls-button is-danger" type="button">文字を消す</button>
              </div>
            </div>
          </details>

          <details class="ls-fold">
            <summary><span class="ls-fold-icon" aria-hidden="true">🖍️</span>縁取り <span id="outlineMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <div id="outlineList" class="ls-chips"></div>
              <div class="ls-field">
                <span class="ls-label">ほかの色</span>
                <div id="outlineColors" class="ls-swatches"></div>
              </div>
              <div class="ls-field">
                <span class="ls-label">太さ</span>
                <div id="outlineWidthList" class="ls-chips"></div>
              </div>
            </div>
          </details>

          <details class="ls-fold">
            <summary><span class="ls-fold-icon" aria-hidden="true">🎨</span>背景 <span id="backgroundMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <div id="backgroundList" class="ls-swatches"></div>
              <p id="backgroundHint" class="ls-hint">画像そのものの背景です。</p>
            </div>
          </details>

          <details class="ls-fold">
            <summary><span class="ls-fold-icon" aria-hidden="true">📐</span>形 <span id="shapeMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <div id="shapeList" class="ls-chips"></div>
            </div>
          </details>

          <details id="motionPanel" class="ls-fold">
            <summary><span class="ls-fold-icon" aria-hidden="true">🎞️</span>動き <span id="motionMeta" class="ls-fold-meta"></span></summary>
            <div class="ls-fold-body">
              <div id="motionList" class="ls-chips"></div>
              <p id="motionHint" class="ls-hint">動きはカードで送ったときに再生されます。</p>
            </div>
          </details>
        </div>

        <section id="historyPanel" class="ls-panel" hidden>
          <div class="ls-panel-head">
            <h2 class="ls-panel-title">🕘 送った画像</h2>
            <p class="ls-panel-note">タップでもう一度送れます。この端末に最大20件残ります。</p>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </div>
    </main>

    <div class="ls-sendbar">
      <div class="ls-sendbar-inner">
        <p id="status" class="ls-status" aria-live="polite"></p>
        <div class="ls-sendbar-row">
          <button id="saveButton" class="ls-send ls-send-secondary" type="button">保存</button>
          <button id="sendButton" class="ls-send" type="button" disabled>トークに送る</button>
        </div>
      </div>
    </div>

    <div id="saveSheet" class="ls-sheet" hidden>
      <div class="ls-sheet-card" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
        <p id="saveTitle" class="ls-sheet-title">画像を保存</p>
        <img id="savePreview" class="sheet-preview ls-checker" alt="保存する画像" />
        <p class="ls-hint">うまく保存できないときは、画像を長押しして保存してください。</p>
        <div class="ls-sheet-actions">
          <button id="saveClose" class="ls-send ls-send-secondary" type="button">閉じる</button>
          <a id="saveDownload" class="ls-send" href="#" download>端末に保存</a>
        </div>
      </div>
    </div>

  </body>
</html>
