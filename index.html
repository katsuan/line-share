<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./shared/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f4f9" />
    <title>おくるん｜つくって、おくるん💬</title>
    <meta name="description" content="場所・予定・お知らせ・文字・手書きを、LINEのトークにカードや画像で送れます。" />
    <!-- リンクを共有したときの表示（画像は tools/ogp.py で作る） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="おくるん" />
    <meta property="og:title" content="おくるん｜つくって、おくるん💬" />
    <meta property="og:description" content="写真やボタン付きのカードを、LINEで送れます。場所・予定・お知らせ・文字・手書きに対応。" />
    <meta property="og:url" content="https://katsuan.github.io/line-share/" />
    <meta property="og:image" content="https://katsuan.github.io/line-share/shared/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="おくるん（OQRN）：写真やボタン付きのカードを、LINEで送れます。" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./shared/ui.css?v=202610132033" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js?v=202610132033"></script>
    <script src="./shared/credit.js?v=202610132033"></script>
    <script src="./shared/liff.js?v=202610132033"></script>
    <style>
      .hub-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .hub-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 28px 4px 20px;
        font-size: 24px;
        font-weight: 800;
      }

      /* 右上のシェア。押すと「カードで送る／リンクでシェア」を選ぶシートを出す */
      .hub-share {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--ls-line-strong);
        border-radius: 999px;
        background: var(--ls-surface);
        color: var(--ls-text);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .share-options {
        display: grid;
        gap: 8px;
      }

      .share-option {
        display: grid;
        gap: 2px;
        padding: 12px 14px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-md);
        background: var(--ls-surface);
        color: var(--ls-text);
        font-size: 15px;
        font-weight: 800;
        text-align: left;
        cursor: pointer;
      }

      .share-option small {
        color: var(--ls-subtext);
        font-size: 13px;
        font-weight: 500;
      }

      /* ロゴ（OQRN）の横に読み方を添える。初めての人にも「おくるん」と読めるように */
      .hub-logo {
        display: block;
        width: auto;
        height: 34px;
      }

      .hub-reading {
        color: var(--ls-subtext);
        font-size: 15px;
        font-weight: 700;
      }

      .hub-lead strong {
        display: block;
        color: var(--ls-text);
        font-size: 16px;
      }

      .hub-tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hub-tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        min-height: 128px;
        padding: 14px 6px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        box-shadow: var(--ls-shadow);
        color: inherit;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        word-break: keep-all;
        text-decoration: none;
      }

      /* いちばんよく使うお知らせカードは横長で先頭に置く */
      .hub-tool.is-featured {
        flex-direction: row;
        justify-content: flex-start;
        gap: 14px;
        min-height: 96px;
        padding: 16px 18px;
        border-color: var(--ls-accent);
        background: var(--ls-accent-soft);
        font-size: 17px;
        text-align: left;
      }

      .hub-tools > li:has(.is-featured) {
        grid-column: 1 / -1;
      }

      .hub-tool.is-featured .hub-mini {
        width: 60px;
        height: 70px;
      }

      .hub-tool-body {
        display: grid;
        gap: 4px;
      }

      .hub-tool.is-featured .hub-tool-desc {
        color: var(--ls-accent-ink);
        font-size: 13px;
      }

      .hub-tool:active {
        background: var(--ls-surface-sub);
      }

      .hub-tool:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: 2px;
      }

      .hub-lead {
        margin: -10px 4px 16px;
        color: var(--ls-subtext);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ツール名の下の一言。何ができるかを名前だけに頼らない */
      .hub-tool-desc {
        color: var(--ls-subtext);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
      }

      /* 完成イメージの小さな見本。アイコンの代わりなので大きさはアイコンと同じくらいに抑える */
      .hub-mini {
        display: grid;
        flex: none;
        width: 52px;
        height: 60px;
      }

      .mini-card {
        align-content: start;
        gap: 4px;
        overflow: hidden;
        padding-bottom: 6px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
        transform: rotate(-4deg);
      }

      .mini-card i {
        display: block;
        margin: 0 6px;
        border-radius: 3px;
      }

      .mini-card .mini-head {
        height: 16px;
        margin: 0;
        border-radius: 0;
        background: linear-gradient(135deg, #f59e0b, #fb7185);
      }

      .mini-card .mini-photo {
        display: grid;
        place-items: center;
        height: 24px;
        margin: 0;
        border-radius: 0;
        background: linear-gradient(135deg, #bfe7d4, #9fd3f5);
        font-size: 12px;
        font-style: normal;
      }

      .mini-card .mini-line {
        height: 4px;
        background: #e4e2ea;
      }

      .mini-card .mini-line.is-short {
        width: 55%;
      }

      .mini-card .mini-button {
        height: 9px;
        margin-top: auto;
        background: var(--ls-accent);
      }

      /* 文字入り画像（白と黒で縁取りした文字）の見本 */
      .mini-sticker {
        place-items: center;
      }

      .mini-sticker svg {
        width: 100%;
      }

      .hub-nowrap {
        white-space: nowrap;
      }


      /* メイン機能とは別の、ほかのページへのリンク */
      /* LINE絵文字：説明と、行の左に置く小さな代表画像 */
      .hub-emoji-lead {
        margin: -4px 4px 10px;
        color: var(--ls-subtext);
        font-size: 13px;
      }

      .hub-link.has-thumb {
        grid-template-columns: 44px minmax(0, 1fr) auto;
      }

      .hub-link-thumb {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        object-fit: contain;
      }

      .hub-more {
        margin-top: 28px;
      }

      .hub-more-title {
        margin: 0 4px 8px;
        color: var(--ls-subtext);
        font-size: 13px;
        font-weight: 800;
      }

      .hub-links {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        overflow: hidden;
      }

      .hub-links li + li {
        border-top: 1px solid var(--ls-line);
      }

      .hub-link {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 8px 16px;
        color: inherit;
        text-decoration: none;
      }

      .hub-link:active {
        background: var(--ls-surface-sub);
      }

      .hub-link:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: -2px;
      }

      .hub-link-icon {
        font-size: 24px;
        text-align: center;
      }

      .hub-link-name {
        display: block;
        font-size: 15px;
        font-weight: 700;
      }

      .hub-link-desc {
        display: block;
        color: var(--ls-subtext);
        font-size: 13px;
      }

      .hub-link-arrow {
        color: var(--ls-faint);
        font-size: 14px;
      }

      .hub-redirect {
        padding-top: 30vh;
        color: var(--ls-subtext);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="hub" class="ls-page">
      <div class="hub-head">
        <h1 class="hub-title"><img class="hub-logo" src="./shared/logo.svg" alt="OQRN" width="113" height="34" /><span class="hub-reading">おくるん</span></h1>
        <button id="shareOpen" class="hub-share" type="button" aria-haspopup="dialog">📤 シェア</button>
      </div>
      <p class="hub-lead"><strong>つくって、おくるん💬</strong>写真やボタン付きのカードを、LINEで送れます。</p>
      <ul class="hub-tools">
        <li>
          <a class="hub-tool is-featured" href="./card/">
            <!-- 完成イメージの小さな見本（お知らせカード） -->
            <span class="hub-mini mini-card" aria-hidden="true"><i class="mini-head"></i><i class="mini-line"></i><i class="mini-line is-short"></i><i class="mini-button"></i></span>
            <span class="hub-tool-body">お知らせを送る<span class="hub-tool-desc">連絡・案内・イベントを、写真やボタン付きのカードで</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./plan/">
            <!-- 地図の写真と日時が入ったカードの見本 -->
            <span class="hub-mini mini-card" aria-hidden="true"><i class="mini-photo">📍</i><i class="mini-line"></i><i class="mini-button"></i></span>
            場所・予定を送る<span class="hub-tool-desc">待ち合わせや予定を、<wbr /><span class="hub-nowrap">地図・日時つきで</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./image/">
            <!-- 文字入り画像の見本（OK の上に手書きでハートと波線を描き足したスタンプ） -->
            <span class="hub-mini mini-sticker" aria-hidden="true"><svg viewBox="0 0 64 46"><g font-family="Arial Black, Hiragino Sans, sans-serif" font-size="30" font-weight="900" text-anchor="middle"><text x="32" y="31" fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round">OK</text><text x="32" y="31" fill="#38ba91" stroke="#18222f" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">OK</text></g><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M51 16C46 12.5 44 10 45 7.5 46 5 49.5 5 51 7.5 52.5 5 56 5 57 7.5 58 10 56 12.6 51.6 15.4" stroke="#fff" stroke-width="5"/><path d="M51 16C46 12.5 44 10 45 7.5 46 5 49.5 5 51 7.5 52.5 5 56 5 57 7.5 58 10 56 12.6 51.6 15.4" stroke="#e5484d" stroke-width="2.2"/><path d="M9 39c5-2.6 9 1.6 14-.6s9-2.4 13 .2 9 1.4 14-1.4" stroke="#fff" stroke-width="5"/><path d="M9 39c5-2.6 9 1.6 14-.6s9-2.4 13 .2 9 1.4 14-1.4" stroke="#6c47ff" stroke-width="2.2"/></g></svg></span>
            文字・手書きを送る<span class="hub-tool-desc">ひとことや手書きを、<wbr /><span class="hub-nowrap">スタンプ風の画像で</span></span>
          </a>
        </li>
      </ul>

      <!-- LINE絵文字・ほかのツール。中身は data/line-emoji.json・data/hub-links.json（下のスクリプトが1行ずつ並べる。
           読めないときや空のときは欄ごと隠す） -->
      <section id="hubEmoji" class="hub-more" aria-labelledby="hubEmojiTitle" hidden>
        <h2 id="hubEmojiTitle" class="hub-more-title"></h2>
        <p id="hubEmojiLead" class="hub-emoji-lead" hidden></p>
        <ul id="hubEmojiList" class="hub-links"></ul>
      </section>

      <section id="hubMore" class="hub-more" aria-labelledby="hubMoreTitle" hidden>
        <h2 id="hubMoreTitle" class="hub-more-title"></h2>
        <ul id="hubMoreList" class="hub-links"></ul>
      </section>
    </main>

    <div id="shareSheet" class="ls-sheet" hidden>
      <div class="ls-sheet-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <p id="shareTitle" class="ls-sheet-title">おくるんをシェア</p>
        <div class="share-options">
          <button id="shareCard" class="share-option" type="button">🪧 LINEにカードで送る<small>紹介カードを、選んだ友だち・グループに送ります</small></button>
          <button id="shareLink" class="share-option" type="button">🔗 リンクでシェア<small>リンクを共有します（共有できないときはコピー）</small></button>
        </div>
        <p id="shareStatus" class="ls-hint" role="status"></p>
        <button id="shareClose" class="ls-sheet-cancel" type="button">閉じる</button>
      </div>
    </div>

    <script>
      // https://liff.line.me/<LIFF ID>/plan/ のようなリンクは、まずこのトップに liff.state 付きで届く。
      // liff.init() が該当ツールのページへ転送する。
      (function () {
        const params = new URLSearchParams(location.search);
        const liffId = window.LINE_SHARE_CONFIG && window.LINE_SHARE_CONFIG.liffId;
        if (!params.has("liff.state") || !liffId || !window.liff) return;

        document.getElementById("hub").innerHTML = '<p class="hub-redirect">開いています…</p>';
        liff.init({ liffId }).catch((error) => {
          console.error(error);
          location.replace(location.pathname);
        });
      })();
    </script>
    <script>
      // LINE絵文字・ほかのツールの欄を JSON から作る（1行ずつのリンク）
      (function () {
        const storeUrl = (id) => `https://line.me/S/emoji/?id=${encodeURIComponent(id)}`;
        const imageUrl = (id) => `https://stickershop.line-scdn.net/sticonshop/v1/product/${encodeURIComponent(id)}/iPhone/main.png?v=1`;
        const authorUrl = (id) => `https://line.me/S/shop/emoji/author/${encodeURIComponent(id)}`;

        const loadJson = (path) =>
          fetch(path, { cache: "no-cache" }).then((response) => (response.ok ? response.json() : Promise.reject(response.status)));

        // row: { url, icon（絵文字）か image（画像の URL）, name, desc }
        function createRow(row) {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.className = "hub-link";
          link.href = row.url;
          let mark;
          if (row.image) {
            link.classList.add("has-thumb");
            mark = document.createElement("img");
            mark.className = "hub-link-thumb";
            mark.src = row.image;
            mark.alt = "";
            mark.loading = "lazy";
            mark.addEventListener("error", () => (mark.style.visibility = "hidden"));
          } else {
            mark = document.createElement("span");
            mark.className = "hub-link-icon";
            mark.textContent = row.icon || "🔗";
          }
          mark.setAttribute("aria-hidden", "true");
          const text = document.createElement("span");
          const name = document.createElement("span");
          name.className = "hub-link-name";
          name.textContent = row.name || "";
          text.append(name);
          if (row.desc) {
            const desc = document.createElement("span");
            desc.className = "hub-link-desc";
            desc.textContent = row.desc;
            text.append(desc);
          }
          const arrow = document.createElement("span");
          arrow.className = "hub-link-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "↗";
          link.append(mark, text, arrow);
          li.append(link);
          return li;
        }

        function fill({ section, title, lead, list }, data, rows) {
          if (!rows.length) return;
          document.getElementById(title).textContent = data.title || "";
          if (lead && data.lead) {
            document.getElementById(lead).textContent = data.lead;
            document.getElementById(lead).hidden = false;
          }
          document.getElementById(list).replaceChildren(...rows.map(createRow));
          document.getElementById(section).hidden = false;
        }

        loadJson("./data/line-emoji.json")
          .then((data) => {
            const rows = (Array.isArray(data.items) ? data.items : [])
              .filter((item) => item && item.id)
              .map((item) => ({ url: item.url || storeUrl(item.id), image: item.image || imageUrl(item.id), name: item.name, desc: item.desc }));
            if (rows.length && data.author && data.author.id) {
              rows.push({
                url: data.author.url || authorUrl(data.author.id),
                icon: "🛍️",
                name: `${data.author.name || "作者"} の絵文字をもっと見る`,
                desc: "LINE STORE の作者ページ"
              });
            }
            fill({ section: "hubEmoji", title: "hubEmojiTitle", lead: "hubEmojiLead", list: "hubEmojiList" }, { title: "LINE絵文字", ...data }, rows);
          })
          .catch((error) => console.error("LINE絵文字を読み込めませんでした", error));

        loadJson("./data/hub-links.json")
          .then((data) => {
            const rows = (Array.isArray(data.items) ? data.items : []).filter((item) => item && item.url && item.name);
            fill({ section: "hubMore", title: "hubMoreTitle", list: "hubMoreList" }, { title: "ほかのツール", ...data }, rows);
          })
          .catch((error) => console.error("ほかのツールを読み込めませんでした", error));
      })();

      // トップのシェア：紹介カードを LINE で送るか、リンクを共有する
      (function () {
        const config = window.LINE_SHARE_CONFIG || {};
        const PAGE_URL = "https://katsuan.github.io/line-share/";
        const TOP_URL = config.liffId ? `https://liff.line.me/${config.liffId}` : PAGE_URL;
        const $ = (id) => document.getElementById(id);
        const sheet = $("shareSheet");
        const status = $("shareStatus");
        if (!sheet || !$("shareOpen")) return;

        const setStatus = (text) => (status.textContent = text);
        const open = () => {
          setStatus("");
          sheet.hidden = false;
          $("shareCard").focus();
        };
        const close = () => {
          sheet.hidden = true;
          $("shareOpen").focus();
        };

        // 紹介カード（お知らせカードの「紹介」テンプレートと同じ中身）
        function introCard() {
          const message = {
            type: "flex",
            altText: "おくるん｜つくって、おくるん💬",
            contents: {
              type: "bubble",
              header: {
                type: "box",
                layout: "vertical",
                background: { type: "linearGradient", angle: "135deg", startColor: "#6C47FF", endColor: "#A48BFF" },
                paddingAll: "16px",
                contents: [
                  { type: "text", text: "おくるん", color: "#FFFFFF", weight: "bold", size: "lg" },
                  { type: "text", text: "つくって、おくるん💬", color: "#FFFFFF", size: "xs", margin: "sm" }
                ]
              },
              hero: {
                type: "image",
                url: `${PAGE_URL}shared/ogp.png`,
                size: "full",
                aspectRatio: "40:21",
                aspectMode: "cover",
                action: { type: "uri", uri: TOP_URL }
              },
              body: {
                type: "box",
                layout: "vertical",
                spacing: "md",
                contents: [
                  { type: "text", text: "写真やボタン付きのカードを、LINEで送れます。", weight: "bold", size: "md", wrap: true },
                  { type: "text", text: "場所・予定・お知らせ・文字や手書きを、カードや画像にしてトークに送れます。", size: "sm", color: "#6B6860", wrap: true }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                contents: [{ type: "button", style: "primary", color: "#6C47FF", action: { type: "uri", label: "おくるんを開く", uri: TOP_URL } }]
              }
            }
          };
          return window.LineShareCredit?.withCredit(message) ?? message;
        }

        async function shareCard() {
          setStatus(window.LineShareLiff.MESSAGES.connecting);
          // LINE の外ではログインしてからこのページに戻る（戻ったらもう一度押す）
          const { ready, reason } = await window.LineShareLiff.init({ login: "redirect" });
          if (!ready) {
            if (reason !== "redirecting") setStatus(window.LineShareLiff.MESSAGES.failed);
            return;
          }
          if (!window.LineShareLiff.canShare()) {
            setStatus(window.LineShareLiff.MESSAGES.notInLine);
            return;
          }
          try {
            const result = await liff.shareTargetPicker([introCard()], { isMultiple: true });
            setStatus(result ? "送りました。" : "送るのをやめました。");
          } catch (error) {
            console.error(error);
            setStatus("送れませんでした。時間をおいてもう一度お試しください。");
          }
        }

        async function shareLink() {
          const data = { title: "おくるん", text: "つくって、おくるん💬 写真やボタン付きのカードを、LINEで送れます。", url: PAGE_URL };
          if (navigator.share) {
            try {
              await navigator.share(data);
              close();
              return;
            } catch (error) {
              if (error?.name === "AbortError") return;
            }
          }
          try {
            await navigator.clipboard.writeText(PAGE_URL);
            setStatus("リンクをコピーしました。");
          } catch {
            setStatus(`リンク：${PAGE_URL}`);
          }
        }

        $("shareOpen").addEventListener("click", open);
        $("shareClose").addEventListener("click", close);
        $("shareCard").addEventListener("click", shareCard);
        $("shareLink").addEventListener("click", shareLink);
        sheet.addEventListener("click", (event) => {
          if (event.target === sheet) close();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !sheet.hidden) close();
        });
      })();
    </script>
  </body>
</html>
