<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LINEで共有</title>
    <meta name="description" content="場所・予定・カード・文字アイコン・手書きを、LINEのトークへ送れるツール集です。" />
    <link rel="stylesheet" href="./shared/ui.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js"></script>
    <style>
      .hub-head {
        padding: 20px 4px 16px;
      }

      .hub-head h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
      }

      .hub-head p {
        margin: 6px 0 0;
        color: var(--ls-subtext);
        font-size: 14px;
        line-height: 1.7;
      }

      .hub-section {
        margin: 18px 4px 8px;
        color: var(--ls-subtext);
        font-size: 12px;
        font-weight: 800;
      }

      .hub-tools {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hub-tool {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 12px;
        align-items: center;
        gap: 14px;
        min-height: 76px;
        padding: 12px 16px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        box-shadow: var(--ls-shadow);
        color: inherit;
        text-decoration: none;
      }

      .hub-tool:active {
        background: var(--ls-surface-sub);
      }

      .hub-tool:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: 2px;
      }

      .hub-tool::after {
        content: "";
        width: 8px;
        height: 8px;
        border-top: 2px solid var(--ls-faint);
        border-right: 2px solid var(--ls-faint);
        transform: rotate(45deg);
      }

      .hub-icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--ls-surface-sub);
        font-size: 26px;
      }

      .hub-name {
        display: block;
        font-size: 16px;
        font-weight: 800;
      }

      .hub-desc {
        display: block;
        margin-top: 2px;
        color: var(--ls-subtext);
        font-size: 13px;
        line-height: 1.5;
      }

      .hub-redirect {
        padding-top: 30vh;
        color: var(--ls-subtext);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="hub" class="ls-page">
      <header class="hub-head">
        <h1>LINEで共有</h1>
        <p>送りたいものを選んでください。選んだトークへ、カードや画像で届きます。</p>
      </header>

      <p class="hub-section">カードで送る</p>
      <ul class="hub-tools">
        <li>
          <a class="hub-tool" href="./plan/?tab=map">
            <span class="hub-icon" aria-hidden="true">📍</span>
            <span><span class="hub-name">場所</span><span class="hub-desc">Google Mapsの場所を写真・バッジ・コメント付きで</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./plan/?tab=calendar">
            <span class="hub-icon" aria-hidden="true">📅</span>
            <span><span class="hub-name">予定</span><span class="hub-desc">Googleカレンダーにそのまま追加できる予定</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./card/">
            <span class="hub-icon" aria-hidden="true">🪧</span>
            <span><span class="hub-name">お知らせカード</span><span class="hub-desc">見出し・写真・バッジ・リンクボタンを自由に</span></span>
          </a>
        </li>
      </ul>

      <p class="hub-section">画像で送る</p>
      <ul class="hub-tools">
        <li>
          <a class="hub-tool" href="./image/?mode=text">
            <span class="hub-icon" aria-hidden="true">💬</span>
            <span><span class="hub-name">文字アイコン</span><span class="hub-desc">文字入りのスタンプ風画像。動きも付けられる</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./image/?mode=draw">
            <span class="hub-icon" aria-hidden="true">👆</span>
            <span><span class="hub-name">手書き</span><span class="hub-desc">指で描いた絵。文字アイコンに描き足すこともできる</span></span>
          </a>
        </li>
      </ul>
    </main>

    <script>
      // https://liff.line.me/<LIFF ID>/plan/ のようなリンクは、まずこのトップに liff.state 付きで届く。
      // liff.init() が該当ツールのページへ転送する。
      (function () {
        const params = new URLSearchParams(location.search);
        const liffId = window.LINE_SHARE_CONFIG && window.LINE_SHARE_CONFIG.liffId;
        if (!params.has("liff.state") || !liffId || !window.liff) return;

        document.getElementById("hub").innerHTML = '<p class="hub-redirect">開いています…</p>';
        liff.init({ liffId }).catch((error) => {
          console.error(error);
          location.replace(location.pathname);
        });
      })();
    </script>
  </body>
</html>
