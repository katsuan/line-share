<!doctype html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./shared/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f4f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
    <title>おくるん｜つくって、おくるん💬</title>
    <meta name="description" content="場所・予定・お知らせ・文字・手書きを、LINEのトークにカードや画像で送れます。" />
    <!-- リンクを共有したときの表示（画像は tools/ogp.py で作る） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="おくるん" />
    <meta property="og:title" content="おくるん｜つくって、おくるん💬" />
    <meta property="og:description" content="写真やボタン付きのカードを、LINEで送れます。場所・予定・お知らせ・文字・手書きに対応。" />
    <meta property="og:url" content="https://katsuan.github.io/line-share/" />
    <meta property="og:image" content="https://katsuan.github.io/line-share/shared/ogp.png?v=20261019" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="おくるん（OQRN）：写真やボタン付きのカードを、LINEで送れます。" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./shared/ui.css?v=202610251830" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js?v=202610251830"></script>
    <script src="./shared/log.js?v=202610251830"></script>
    <script src="./shared/credit.js?v=202610251830"></script>
    <script src="./shared/plan.js?v=202610251830"></script>
    <script src="./shared/season.js?v=202610251830" defer></script>
    <script src="./shared/liff.js?v=202610251830"></script>
    <link rel="stylesheet" href="./style.css?v=202610251830" />
  </head>
  <body>
    <main id="hub" class="ls-page">
      <!-- 見出しは1行：アイコン＋名前（左）と、横長のロゴ（右）。ほかのツール（さくせん盤・ろくがなど）と同じ形 -->
      <div class="hub-head">
        <h1 class="hub-title"><img class="hub-icon" src="./shared/icon.svg" alt="" width="36" height="36" /><span class="hub-name">おくるん</span></h1>
        <!-- 暗い表示では O・R・N を明るい色にしたロゴ（tools/brand.py） -->
        <picture class="hub-logo-pic"><source srcset="./shared/logo-dark.svg" media="(prefers-color-scheme: dark)" /><img class="hub-logo" src="./shared/logo.svg" alt="OQRN" width="99" height="30" /></picture>
      </div>
      <!-- キャッチコピーと説明。「紹介する」はその右 -->
      <div class="hub-lead-row">
        <p class="hub-lead"><strong>つくって、おくるん<span class="hub-mark" aria-hidden="true"></span></strong>写真やボタン付きの<span class="hub-nowrap">カードを、</span><span class="hub-nowrap">LINEで送れます。</span><span id="hubSeason"></span></p>
        <button id="shareOpen" class="hub-share" type="button" aria-haspopup="dialog">📤 紹介する</button>
      </div>
      <!-- 最近つかったツール（ConneQt のツールを開くと覚える。なければ出さない） -->
      <nav id="hubRecent" class="hub-recent" aria-labelledby="hubRecentTitle" hidden>
        <p id="hubRecentTitle" class="hub-recent-title">最近つかった</p>
        <ul id="hubRecentList" class="hub-recent-list"></ul>
      </nav>
      <ul class="hub-tools">
        <li>
          <a class="hub-tool is-featured" href="./card/?from=home">
            <!-- 完成イメージの小さな見本（お知らせカード） -->
            <span class="hub-mini mini-card" aria-hidden="true"><i class="mini-head"></i><i class="mini-line"></i><i class="mini-line is-short"></i><i class="mini-button"></i></span>
            <span class="hub-tool-body">お知らせを送る<span class="hub-tool-desc">連絡・案内・イベントを、写真やボタン付きのカードで</span></span>
          </a>
        </li>
        <!-- お知らせカードのほかの形式。押すとその形式のテンプレートが入った状態で開く（card/?template=<data/templates.json のキー>） -->
        <li class="hub-formats-row">
          <p class="hub-formats-label">形式を選んでつくる</p>
          <div class="hub-formats">
            <a class="hub-format" href="./card/?template=vote&from=home"><span class="hub-format-icon" aria-hidden="true">🗳️</span>投票</a>
            <a class="hub-format" href="./card/?template=checklist&from=home"><span class="hub-format-icon" aria-hidden="true">🧳</span>持ち物</a>
            <a class="hub-format" href="./card/?template=ticket&from=home"><span class="hub-format-icon" aria-hidden="true">🎫</span>チケット</a>
            <a class="hub-format" href="./card/?template=coupon&from=home"><span class="hub-format-icon" aria-hidden="true">🎟️</span>クーポン</a>
          </div>
        </li>
        <li>
          <a class="hub-tool" href="./plan/?from=home">
            <!-- 地図の写真と日時が入ったカードの見本 -->
            <span class="hub-mini mini-card" aria-hidden="true"><i class="mini-photo">📍</i><i class="mini-line"></i><i class="mini-button"></i></span>
            場所・予定を送る<span class="hub-tool-desc">待ち合わせや予定を、<wbr /><span class="hub-nowrap">地図・日時つきで</span></span>
          </a>
        </li>
        <li>
          <a class="hub-tool" href="./image/?from=home">
            <!-- 文字入り画像の見本（OK の上に手書きでハートと波線を描き足したスタンプ） -->
            <span class="hub-mini mini-sticker" aria-hidden="true"><svg viewBox="0 0 64 46"><g font-family="Arial Black, Hiragino Sans, sans-serif" font-size="30" font-weight="900" text-anchor="middle"><text x="32" y="31" fill="#fff" stroke="#fff" stroke-width="9" stroke-linejoin="round">OK</text><text x="32" y="31" fill="#38ba91" stroke="#18222f" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">OK</text></g><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M51 16C46 12.5 44 10 45 7.5 46 5 49.5 5 51 7.5 52.5 5 56 5 57 7.5 58 10 56 12.6 51.6 15.4" stroke="#fff" stroke-width="5"/><path d="M51 16C46 12.5 44 10 45 7.5 46 5 49.5 5 51 7.5 52.5 5 56 5 57 7.5 58 10 56 12.6 51.6 15.4" stroke="#e5484d" stroke-width="2.2"/><path d="M9 39c5-2.6 9 1.6 14-.6s9-2.4 13 .2 9 1.4 14-1.4" stroke="#fff" stroke-width="5"/><path d="M9 39c5-2.6 9 1.6 14-.6s9-2.4 13 .2 9 1.4 14-1.4" stroke="#6c47ff" stroke-width="2.2"/></g></svg></span>
            文字・手書きを送る<span class="hub-tool-desc">ひとことや手書きを、<wbr /><span class="hub-nowrap">スタンプ風の画像で</span></span>
          </a>
        </li>
      </ul>

      <!-- ほかのツール・LINE絵文字。中身は data/hub-links.json・data/line-emoji.json（下のスクリプトが1行ずつ並べる。
           読めないときや空のときは欄ごと隠す） -->
      <section id="hubMore" class="hub-more" aria-labelledby="hubMoreTitle" hidden>
        <h2 id="hubMoreTitle" class="hub-more-title"></h2>
        <!-- 名前（コネクト 〜ConneQt〜＝Connect＋Q）だけでは伝わらないので、補足の1行（data/hub-links.json の lead） -->
        <p id="hubMoreLead" class="hub-emoji-lead" hidden></p>
        <ul id="hubMoreList" class="hub-links"></ul>
      </section>

      <section id="hubEmoji" class="hub-more" aria-labelledby="hubEmojiTitle" hidden>
        <h2 id="hubEmojiTitle" class="hub-more-title"></h2>
        <p id="hubEmojiLead" class="hub-emoji-lead" hidden></p>
        <ul id="hubEmojiList" class="hub-links"></ul>
      </section>
      <p class="hub-foot"><a href="./account/">⭐ プラン（無料・有償で使える機能）</a></p>
      <p class="hub-foot"><a href="./backup/">💾 この端末の記録をバックアップ</a></p>
    </main>

    <div id="shareSheet" class="ls-sheet" hidden>
      <div class="ls-sheet-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <p id="shareTitle" class="ls-sheet-title">おくるんを紹介する</p>
        <div class="share-options">
          <button id="shareCard" class="share-option" type="button"><span class="share-option-title is-oqrn">カードで送る</span><small>紹介カードを、選んだ <span class="hub-nowrap">LINE の友だち</span>・<span class="hub-nowrap">グループに</span><span class="hub-nowrap">送ります</span></small></button>
          <button id="shareLink" class="share-option" type="button">🔗 リンクでシェア<small>リンクを共有します<span class="hub-nowrap">（共有できないときは</span><span class="hub-nowrap">コピー）</span></small></button>
          <!-- 作成者（config.js の ownerUsers）だけに出す -->
          <button id="shareAll" class="share-option" type="button" hidden>🗂 全ツールのカードを送る<small id="shareAllNote">作成者だけ。おくるんとツールの紹介カードを横に並べて送ります（ツールが12個をこえたらグループごと）</small></button>
        </div>
        <p id="shareStatus" class="ls-hint" role="status"></p>
        <button id="shareClose" class="ls-sheet-cancel" type="button">閉じる</button>
      </div>
    </div>

    <!-- ほかのツールをタップしたときのカード（下のスクリプトが中身を入れる） -->
    <div id="toolSheet" class="ls-sheet" hidden>
      <div class="ls-sheet-card" role="dialog" aria-modal="true" aria-labelledby="toolTitle">
        <img id="toolOgp" class="tool-ogp" alt="" width="1200" height="630" />
        <p id="toolTitle" class="ls-sheet-title"></p>
        <p id="toolCopy" class="tool-copy" hidden></p>
        <p id="toolLead" class="tool-lead"></p>
        <a id="toolOpen" class="ls-button is-primary is-block tool-open" href="#"></a>
        <a id="toolLine" class="ls-button is-block tool-line" href="#" hidden>📱 LINE 版で開く</a>
        <p id="toolWhy" class="tool-why" hidden></p>
        <button id="toolClose" class="ls-sheet-cancel" type="button">閉じる</button>
      </div>
    </div>

    <script src="./app.js?v=202610251830"></script>
    <!-- 電波がなくても開けるように（sw.js） -->
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});</script>
  </body>
</html>
