<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LINEで送る</title>
    <meta name="description" content="場所・予定・カード・文字アイコン・手書きを、LINEのトークへ送れるツール集です。" />
    <link rel="stylesheet" href="./shared/ui.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js"></script>
    <style>
      .hub-title {
        margin: 0;
        padding: 28px 4px 20px;
        font-size: 24px;
        font-weight: 800;
      }

      .hub-tools {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hub-tool {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 88px;
        padding: 0 20px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        box-shadow: var(--ls-shadow);
        color: inherit;
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }

      .hub-tool:active {
        background: var(--ls-surface-sub);
      }

      .hub-tool:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: 2px;
      }

      .hub-icon {
        min-width: 72px;
        font-size: 30px;
        line-height: 1;
      }

      .hub-redirect {
        padding-top: 30vh;
        color: var(--ls-subtext);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="hub" class="ls-page">
      <h1 class="hub-title">LINEで送る</h1>
      <ul class="hub-tools">
        <li><a class="hub-tool" href="./plan/"><span class="hub-icon" aria-hidden="true">📍📅</span>場所・予定</a></li>
        <li><a class="hub-tool" href="./card/"><span class="hub-icon" aria-hidden="true">🪧</span>カード</a></li>
        <li><a class="hub-tool" href="./image/"><span class="hub-icon" aria-hidden="true">💬👆</span>文字・手書き</a></li>
      </ul>
    </main>

    <script>
      // https://liff.line.me/<LIFF ID>/plan/ のようなリンクは、まずこのトップに liff.state 付きで届く。
      // liff.init() が該当ツールのページへ転送する。
      (function () {
        const params = new URLSearchParams(location.search);
        const liffId = window.LINE_SHARE_CONFIG && window.LINE_SHARE_CONFIG.liffId;
        if (!params.has("liff.state") || !liffId || !window.liff) return;

        document.getElementById("hub").innerHTML = '<p class="hub-redirect">開いています…</p>';
        liff.init({ liffId }).catch((error) => {
          console.error(error);
          location.replace(location.pathname);
        });
      })();
    </script>
  </body>
</html>
