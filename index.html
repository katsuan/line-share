<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./shared/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f4f9" />
    <title>おくるカード</title>
    <meta name="description" content="場所・予定・お知らせ・文字・手書きを、LINEのトークにカードや画像で送れます。" />
    <link rel="stylesheet" href="./shared/ui.css?v=202610102340" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js?v=202610102340"></script>
    <script src="./shared/credit.js?v=202610102340"></script>
    <style>
      .hub-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 28px 4px 20px;
        font-size: 24px;
        font-weight: 800;
      }

      .hub-tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hub-tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        min-height: 128px;
        padding: 14px 6px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        box-shadow: var(--ls-shadow);
        color: inherit;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        word-break: keep-all;
        text-decoration: none;
      }

      /* いちばんよく使うお知らせカードは横長で先頭に置く */
      .hub-tool.is-featured {
        flex-direction: row;
        justify-content: flex-start;
        gap: 14px;
        min-height: 96px;
        padding: 16px 18px;
        border-color: var(--ls-accent);
        background: var(--ls-accent-soft);
        font-size: 17px;
        text-align: left;
      }

      .hub-tools > li:has(.is-featured) {
        grid-column: 1 / -1;
      }

      .hub-tool.is-featured .hub-icon {
        font-size: 40px;
      }

      .hub-tool-body {
        display: grid;
        gap: 4px;
      }

      .hub-tool.is-featured .hub-tool-desc {
        color: var(--ls-accent-ink);
        font-size: 13px;
      }

      .hub-tool:active {
        background: var(--ls-surface-sub);
      }

      .hub-tool:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: 2px;
      }

      .hub-lead {
        margin: -10px 4px 16px;
        color: var(--ls-subtext);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ツール名の下の一言。何ができるかを名前だけに頼らない */
      .hub-tool-desc {
        color: var(--ls-subtext);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
      }

      .hub-icon {
        font-size: 30px;
        line-height: 1;
        letter-spacing: -2px;
      }

      /* メイン機能とは別の、ほかのページへのリンク */
      .hub-more {
        margin-top: 28px;
      }

      .hub-more-title {
        margin: 0 4px 8px;
        color: var(--ls-subtext);
        font-size: 13px;
        font-weight: 800;
      }

      .hub-links {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        overflow: hidden;
      }

      .hub-links li + li {
        border-top: 1px solid var(--ls-line);
      }

      .hub-link {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 8px 16px;
        color: inherit;
        text-decoration: none;
      }

      .hub-link:active {
        background: var(--ls-surface-sub);
      }

      .hub-link:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: -2px;
      }

      .hub-link-icon {
        font-size: 24px;
        text-align: center;
      }

      .hub-link-name {
        display: block;
        font-size: 15px;
        font-weight: 700;
      }

      .hub-link-desc {
        display: block;
        color: var(--ls-subtext);
        font-size: 13px;
      }

      .hub-link-arrow {
        color: var(--ls-faint);
        font-size: 14px;
      }

      .hub-redirect {
        padding-top: 30vh;
        color: var(--ls-subtext);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="hub" class="ls-page">
      <h1 class="hub-title"><img src="./shared/icon.svg" alt="" width="36" height="36" />おくるカード</h1>
      <p class="hub-lead">写真やボタン付きのカードを、LINEで送れます。</p>
      <ul class="hub-tools">
        <li>
          <a class="hub-tool is-featured" href="./card/">
            <span class="hub-icon" aria-hidden="true">🪧</span>
            <span class="hub-tool-body">お知らせカード<span class="hub-tool-desc">写真・ボタン付きのお知らせを作って送る</span></span>
          </a>
        </li>
        <li><a class="hub-tool" href="./plan/"><span class="hub-icon" aria-hidden="true">📍📅</span>場所・予定<span class="hub-tool-desc">地図や予定を<wbr />カードで</span></a></li>
        <li><a class="hub-tool" href="./image/"><span class="hub-icon" aria-hidden="true">💬👆</span>文字・手書き<span class="hub-tool-desc">スタンプ風の<wbr />画像に</span></a></li>
      </ul>

      <section class="hub-more" aria-labelledby="hubMoreTitle">
        <h2 id="hubMoreTitle" class="hub-more-title">ほかのツール</h2>
        <ul class="hub-links">
          <li>
            <a class="hub-link" href="https://katsuan.github.io/line-workout-share/">
              <span class="hub-link-icon" aria-hidden="true">🏋️</span>
              <span><span class="hub-link-name">ワークアウト共有</span><span class="hub-link-desc">トレーニング内容をまとめてLINEで送る</span></span>
              <span class="hub-link-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a class="hub-link" href="https://katsuan.github.io/pomodoro/">
              <span class="hub-link-icon" aria-hidden="true">🍅</span>
              <span><span class="hub-link-name">ポモドーロ</span><span class="hub-link-desc">集中と休憩をくり返すタイマー</span></span>
              <span class="hub-link-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a class="hub-link" href="https://katsuan.github.io/line-p2p-othello/">
              <span class="hub-link-icon" aria-hidden="true">👾</span>
              <span><span class="hub-link-name">オセロ</span><span class="hub-link-desc">LINEの友だちと2人で対戦</span></span>
              <span class="hub-link-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a class="hub-link" href="https://katsuan.github.io/gender-reveal/create.html">
              <span class="hub-link-icon" aria-hidden="true">🐣</span>
              <span><span class="hub-link-name">ジェンダーリビール</span><span class="hub-link-desc">赤ちゃんの性別をプレゼント演出で発表</span></span>
              <span class="hub-link-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <script>
      // https://liff.line.me/<LIFF ID>/plan/ のようなリンクは、まずこのトップに liff.state 付きで届く。
      // liff.init() が該当ツールのページへ転送する。
      (function () {
        const params = new URLSearchParams(location.search);
        const liffId = window.LINE_SHARE_CONFIG && window.LINE_SHARE_CONFIG.liffId;
        if (!params.has("liff.state") || !liffId || !window.liff) return;

        document.getElementById("hub").innerHTML = '<p class="hub-redirect">開いています…</p>';
        liff.init({ liffId }).catch((error) => {
          console.error(error);
          location.replace(location.pathname);
        });
      })();
    </script>
  </body>
</html>
