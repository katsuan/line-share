<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="./shared/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./shared/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f4f9" />
    <title>おくるカード</title>
    <meta name="description" content="場所・予定・お知らせ・文字・手書きを、LINEのトークにカードや画像で送れます。" />
    <link rel="stylesheet" href="./shared/ui.css?v=202610101950" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js?v=202610101950"></script>
    <script src="./shared/credit.js?v=202610101950"></script>
    <style>
      .hub-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 28px 4px 20px;
        font-size: 24px;
        font-weight: 800;
      }

      .hub-tools {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .hub-tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        min-height: 128px;
        padding: 14px 6px;
        border: 1px solid var(--ls-line);
        border-radius: var(--ls-radius-lg);
        background: var(--ls-surface);
        box-shadow: var(--ls-shadow);
        color: inherit;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        word-break: keep-all;
        text-decoration: none;
      }

      .hub-tool:active {
        background: var(--ls-surface-sub);
      }

      .hub-tool:focus-visible {
        outline: 2px solid var(--ls-text);
        outline-offset: 2px;
      }

      .hub-icon {
        font-size: 30px;
        line-height: 1;
        letter-spacing: -2px;
      }

      .hub-redirect {
        padding-top: 30vh;
        color: var(--ls-subtext);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="hub" class="ls-page">
      <h1 class="hub-title"><img src="./shared/icon.svg" alt="" width="36" height="36" />おくるカード</h1>
      <ul class="hub-tools">
        <li><a class="hub-tool" href="./plan/"><span class="hub-icon" aria-hidden="true">📍📅</span>場所・予定</a></li>
        <li><a class="hub-tool" href="./card/"><span class="hub-icon" aria-hidden="true">🪧</span><span>お知らせ<wbr />カード</span></a></li>
        <li><a class="hub-tool" href="./image/"><span class="hub-icon" aria-hidden="true">💬👆</span>文字・手書き</a></li>
      </ul>
    </main>

    <script>
      // https://liff.line.me/<LIFF ID>/plan/ のようなリンクは、まずこのトップに liff.state 付きで届く。
      // liff.init() が該当ツールのページへ転送する。
      (function () {
        const params = new URLSearchParams(location.search);
        const liffId = window.LINE_SHARE_CONFIG && window.LINE_SHARE_CONFIG.liffId;
        if (!params.has("liff.state") || !liffId || !window.liff) return;

        document.getElementById("hub").innerHTML = '<p class="hub-redirect">開いています…</p>';
        liff.init({ liffId }).catch((error) => {
          console.error(error);
          location.replace(location.pathname);
        });
      })();
    </script>
  </body>
</html>
